name: Links

on:
  repository_dispatch:
  workflow_dispatch:
  schedule:
    - cron: "00 18 */2 * *"

jobs:
  linkChecker:
    runs-on: ubuntu-latest
    permissions:
      issues: write 
    steps:
      - uses: actions/checkout@v5

      - name: Link Checker
        id: lychee
        uses: lycheeverse/lychee-action@v2
        with:
          fail: false
          format: json
          output: ./lychee/out.md
          args: './js/sites.js --insecure=true --max-retries 5 --retry-wait-time 30 --timeout 30'

      - name: Restore previous failures
        uses: actions/cache/restore@v4
        with:
          path: ./lychee/failed-urls.txt
          key: link-state-nomatch-${{ github.run_id }}
          restore-keys: link-state-

      - name: Compare with previous run
        id: compare
        run: |
          # Shift previously failed urls to a temp file
          if [ -f ./lychee/failed-urls.txt ]; then
            cp ./lychee/failed-urls.txt previous.txt
          else
            : > previous.txt
          fi

          # Need to check json output format...
          if [ -f lychee/out.json ]; then
            jq -r '(.error_map // .fail_map // {}) | to_entries[].value[].url' \
              lychee/out.json | sort -u > current.txt
          else
            echo "TEST"
            : > current.txt
          fi

          cat current.txt

      - name: Create Issue From File
        if: steps.lychee.outputs.exit_code != 0
        uses: peter-evans/create-issue-from-file@v5
        with:
          title: Link Checker Report
          content-filepath: ./lychee/out.md
          labels: report, automated issue
